/* Layout: ciemna, spokojna scena; jeden elektryczny błękit tylko tam, gdzie prowadzi do kontaktu. Asymetryczne hero, bento realizacji, kontakt jako finał. */
:root{
  --bg:#0a0c11; --bg-2:#0f121a; --surface:#141824; --surface-2:#1a1f2d;
  --line:rgba(150,170,215,.12); --line-2:rgba(150,170,215,.22);
  --fg:#e9edf5; --muted:#8e97ab; --dim:#5d6578;
  --blue:#2f6bff; --blue-hi:#5b8cff; --blue-text:#86a9ff; --blue-glow:rgba(47,107,255,.35);
  --ok:#3ccf8e;
  --f-display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-s:10px; --r-m:16px; --r-l:24px;
  --ease:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.55,0,.75,.2);
  --wrap:1180px;
  --gx:max(20px,env(safe-area-inset-left,0px));
  --gy:max(20px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px;border-radius:6px}
::selection{background:var(--blue);color:#fff}
html{scrollbar-width:thin;scrollbar-color:rgba(150,170,215,.28) var(--bg)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(150,170,215,.22);border-radius:999px;border:3px solid var(--bg);background-clip:padding-box;transition:background .3s}
::-webkit-scrollbar-thumb:hover{background:var(--blue-hi);background-clip:padding-box}
::-webkit-scrollbar-thumb:active{background:var(--blue);background-clip:padding-box}
::-webkit-scrollbar-corner{background:var(--bg)}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gx);padding-right:var(--gy)}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;font-weight:650;letter-spacing:-.03em;line-height:1.04;margin:0;text-wrap:balance}
h2{font-size:clamp(34px,5vw,58px)}
h3{font-size:22px;letter-spacing:-.015em;line-height:1.2}
p{margin:0}
.lead{color:var(--muted);font-size:18px;max-width:60ch}
section{position:relative}
.sec{padding-block:clamp(88px,12vw,150px)}
.sec-head{display:grid;gap:18px;margin-bottom:clamp(40px,6vw,64px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-text)}
.eyebrow::before{content:"";width:18px;height:1px;background:currentColor}

/* ---------- progress + nav ---------- */
.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--blue),var(--blue-hi));z-index:70;pointer-events:none}
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:center;padding:14px var(--gy) 0 var(--gx);pointer-events:none}
.nav-in{pointer-events:auto;display:flex;align-items:center;gap:22px;width:100%;max-width:var(--wrap);padding:10px 10px 10px 16px;border:1px solid transparent;border-radius:999px;transition:max-width .7s var(--ease),background .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease),padding .5s var(--ease)}
.nav.is-stuck .nav-in{max-width:860px;background:rgba(16,19,28,.72);border-color:var(--line-2);box-shadow:0 18px 50px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mark{width:44px;height:22px;overflow:visible}
.mark path{fill:none;stroke:var(--fg);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw 1.4s var(--ease) forwards}
.mark path:nth-child(2){animation-delay:.18s}.mark path:nth-child(3){animation-delay:.36s}
.mark circle{fill:var(--blue);transform-origin:center;transform-box:fill-box;animation:pop .5s var(--ease) 1.1s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap;transition:opacity .4s var(--ease),width .5s var(--ease)}
.nav.is-stuck .brand-name{opacity:0;width:0;overflow:hidden}
.brand:hover .mark path{animation:redraw .9s var(--ease)}
@keyframes redraw{0%{stroke-dashoffset:0}45%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
.links{position:relative;display:flex;gap:2px;margin-left:auto;list-style:none;padding:0;margin-block:0}
.links a{position:relative;z-index:1;display:block;padding:9px 14px;font-size:14.5px;color:var(--muted);border-radius:999px;transition:color .25s var(--ease)}
.links a:hover,.links a.is-active{color:var(--fg)}
.links a.is-active::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--blue-hi);transform:translateX(-50%)}
.hl{position:absolute;top:0;left:0;height:100%;border-radius:999px;background:rgba(150,170,215,.09);opacity:0;transition:transform .45s var(--ease),width .45s var(--ease),opacity .25s;pointer-events:none}
.links:hover .hl{opacity:1}
.burger{display:none}

/* ---------- buttons ---------- */
.btn{--mx:0px;--my:0px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:550;font-size:15.5px;cursor:pointer;border:1px solid transparent;transform:translate(var(--mx),var(--my));transition:transform .35s var(--ease),background .3s,border-color .3s,box-shadow .35s var(--ease);white-space:nowrap;isolation:isolate;overflow:hidden}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 10px 30px -10px var(--blue-glow),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120px circle at var(--bx,50%) var(--by,50%),rgba(255,255,255,.28),transparent 60%);opacity:0;transition:opacity .3s}
.btn-primary:hover{background:#3a74ff;box-shadow:0 16px 40px -10px var(--blue-glow),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-primary:hover::before{opacity:1}
.btn-ghost{border-color:var(--line-2);color:var(--fg);background:rgba(255,255,255,.015)}
.btn-ghost:hover{border-color:rgba(150,170,215,.4);background:rgba(255,255,255,.04)}
.btn .arr{display:inline-block;width:16px;height:16px;position:relative;overflow:hidden}
.btn .arr svg{position:absolute;inset:0;transition:transform .45s var(--ease)}
.btn .arr svg+svg{transform:translateX(-120%)}
.btn:hover .arr svg:first-child{transform:translateX(120%)}
.btn:hover .arr svg+svg{transform:translateX(0)}
.btn-sm{min-height:42px;padding:0 18px;font-size:14.5px}
.btn:active{transform:translate(var(--mx),var(--my)) scale(.97)}

/* ---------- hero ---------- */
.hero{padding-top:clamp(120px,16vw,170px);padding-bottom:clamp(64px,8vw,96px);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 70% at 60% 30%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 70% at 60% 30%,#000 20%,transparent 75%);opacity:.55;pointer-events:none}
.swarm{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
.hero-grid{position:relative;display:grid;grid-template-columns:1.25fr .9fr;gap:clamp(32px,6vw,72px);align-items:center}
.status{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-bottom:30px;padding-bottom:10px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:linear-gradient(var(--line-2),var(--line-2)) left bottom/100% 1px no-repeat}
.status .past[hidden],.status .sep[hidden]{display:none}
.status .past{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--dim)}
.status .sep{color:var(--dim)}
.status .now{display:inline-flex;align-items:center;gap:9px;color:var(--ok)}
.status .now b{font-weight:500;color:var(--fg)}
.status::after{content:"";position:absolute}
.status{position:relative}
.status:hover{background:linear-gradient(var(--ok),var(--ok)) left bottom/100% 1px no-repeat;color:var(--fg)}
.status{transition:color .3s}
.dot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--ok);animation:ping 2.2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}
.hero h1{font-size:clamp(40px,6.6vw,84px);font-weight:700;font-stretch:115%;letter-spacing:-.04em;line-height:1}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.hero h1 .w>span{display:inline-block;animation:rise .9s var(--ease) both;animation-delay:calc(var(--i)*70ms + 120ms)}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.free{position:relative;color:var(--blue-text);white-space:nowrap}
.free svg{position:absolute;left:-2%;bottom:-.14em;width:104%;height:.32em;overflow:visible}
.free svg path{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s var(--ease) 1.05s forwards}
.hero .lead{margin-top:40px;font-size:clamp(17px,1.6vw,19.5px)}
.hero .lead strong{color:var(--fg);font-weight:550}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.reassure{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-size:14px;color:var(--muted)}
.reassure span{display:inline-flex;align-items:center;gap:8px}
.reassure svg{width:16px;height:16px;color:var(--blue-text);flex-shrink:0}
.fade-up{animation:fadeUp .9s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.portrait{position:relative;perspective:1000px;justify-self:end;width:100%;max-width:420px}
.portrait-card{position:relative;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line-2);background:var(--surface);aspect-ratio:4/5;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s var(--ease);box-shadow:0 40px 90px -40px rgba(0,0,0,.9)}
.portrait-card img{width:100%;height:100%;object-fit:cover;object-position:42% 20%;transform:scale(1.04);transition:transform 1.2s var(--ease)}
.portrait:hover .portrait-card img{transform:scale(1.08)}
.portrait-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,12,17,.85));pointer-events:none}
.portrait-cap{position:absolute;left:20px;right:20px;bottom:18px;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:12px}
.portrait-cap b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.portrait-cap span{font-size:13.5px;color:var(--muted)}
.chip{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(20,24,36,.82);border:1px solid var(--line-2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13.5px;box-shadow:0 20px 40px -20px rgba(0,0,0,.8);animation:float 7s ease-in-out infinite;white-space:nowrap}
.chip i{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:rgba(47,107,255,.16);color:var(--blue-text);font-style:normal}
.chip i svg{width:15px;height:15px}
.chip small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.chip-a{top:12%;left:-14%}
.chip-b{bottom:22%;right:-10%;animation-delay:-3.5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- marquee ---------- */
.marquee{border-block:1px solid var(--line);overflow:hidden;padding-block:18px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq-track{display:flex;width:max-content;animation:mq 46s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
.mq-track span{display:inline-flex;align-items:center;gap:28px;padding-right:28px;font-family:var(--f-display);font-size:clamp(20px,2.4vw,28px);font-weight:500;color:var(--dim);white-space:nowrap;transition:color .3s}
.mq-track span:hover{color:var(--fg)}
.mq-track span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.mq-track .pl{color:var(--muted)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- spotlight cards ---------- */
.spot{position:relative;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);isolation:isolate;transition:border-color .3s,transform .5s var(--ease)}
.spot::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),rgba(91,140,255,.7),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s;pointer-events:none}
.spot::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:radial-gradient(420px circle at var(--x,50%) var(--y,50%),rgba(47,107,255,.09),transparent 65%);opacity:0;transition:opacity .35s;pointer-events:none}
